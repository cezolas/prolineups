<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="HE">
  <!-- original cartoon HE grenade (drawn for Pronades) -->
  <g stroke="#1b1405" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- pin ring -->
    <circle cx="29" cy="7.5" r="4" fill="none" stroke="#c9ced6" stroke-width="2.4"/>
    <circle cx="29" cy="7.5" r="4" fill="none" stroke-width="1"/>
    <!-- spoon / lever -->
    <path d="M22 9.5 C 28 9.5, 31 13, 30.5 20 L 28.4 19.6 C 28.6 14.5, 26.5 12.2, 22 12.2 Z" fill="#9aa3ad"/>
    <!-- cap -->
    <rect x="14.5" y="7" width="9" height="6.5" rx="2" fill="#b8c0c9"/>
    <!-- body -->
    <circle cx="19" cy="24" r="12" fill="#f5b83d"/>
  </g>
  <!-- body shading + frag segments -->
  <path d="M10 28 A 12 12 0 0 0 28 31" fill="none" stroke="#c98a12" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M19 12.4 V 35.6 M 8.2 24 H 29.8" stroke="#c98a12" stroke-width="1.4" opacity=".55"/>
  <ellipse cx="14" cy="17.5" rx="3.6" ry="2.2" fill="#ffffff" opacity=".5" transform="rotate(-30 14 17.5)"/>
  <!-- face -->
  <ellipse cx="15.2" cy="23.2" rx="1.9" ry="2.4" fill="#1b1405"/>
  <ellipse cx="22.8" cy="23.2" rx="1.9" ry="2.4" fill="#1b1405"/>
  <circle cx="15.8" cy="22.4" r=".75" fill="#fff"/>
  <circle cx="23.4" cy="22.4" r=".75" fill="#fff"/>
  <path d="M16.6 27.2 Q 19 29.6 21.4 27.2" fill="none" stroke="#1b1405" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="12.3" cy="26.6" rx="1.8" ry="1.1" fill="#ff8f6b" opacity=".7"/>
  <ellipse cx="25.7" cy="26.6" rx="1.8" ry="1.1" fill="#ff8f6b" opacity=".7"/>
</svg>
